<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Contact Us</h1>
  </header>

  <main class="contact-container">
    <section class="contact-form-section">
      <h2>Send Us a Message</h2>
      <form action="mailto:nofiltoori11@gmail.com" method="post" enctype="text/plain" class="contact-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message..." rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <section class="contact-info-section">
      <h2>Contact Information</h2>
      <p><strong>Address:</strong> University of central Punjab, Lahore, Pakistan</p>
      <p><strong>Phone:</strong> +92 302 5945558</p>
      <p><strong>Email:</strong> nofiltoori11@gmail.com</p>
      <p><strong>Working Hours:</strong> Mon - Fri, 9:00 AM - 5:00 PM</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Mobile Store. All rights reserved.</p>
  </footer>
</body>
</html>
